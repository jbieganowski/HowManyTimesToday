<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1efe9"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="428" rx="24" fill="url(#bg)" stroke="#ddd8cc" stroke-width="2"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2b2b28" text-anchor="start">Gdzie leżą dane</text>
  <text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6859" text-anchor="start">trzy miejsca, każde z własnym zadaniem</text>
  <rect x="40" y="120" width="290" height="140" rx="12" fill="#e6f0f8" stroke="#4a90c4" stroke-width="1.8"/>
  <text x="185.0" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a90c4" text-anchor="middle">Opcje wpisu konfiguracji</text>
  <text x="185.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">harmonogramy: nazwa, opis,</text>
  <text x="185.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">tryb, godziny / interwał,</text>
  <text x="185.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">start, koniec, okno;</text>
  <text x="185.0" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">dźwięk, usługa push</text>
  <rect x="355" y="120" width="290" height="140" rx="12" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="500.0" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32" text-anchor="middle">…_schedule_state_&lt;entry_id&gt;</text>
  <text x="500.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">ostatnie naciśnięcie, przetw. do,</text>
  <text x="500.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">otwarte terminy (i flaga pominięcia),</text>
  <text x="500.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">number_blinking,</text>
  <text x="500.0" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">manually_inactive</text>
  <rect x="670" y="120" width="290" height="140" rx="12" fill="#fbf0dc" stroke="#b26a00" stroke-width="1.8"/>
  <text x="815.0" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b26a00" text-anchor="middle">…_schedule_history_&lt;entry_id&gt;</text>
  <text x="815.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">{schedule_id: [entries]}</text>
  <text x="815.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">timestamp, kind, scheduled_at,</text>
  <text x="815.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">outside_schedule, count_delta</text>
  <text x="185" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a90c4" text-anchor="middle">edytowane w Options Flow</text>
  <text x="500" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2e7d32" text-anchor="middle">nadpisywany po naciśnięciu, terminie lub przełączeniu</text>
  <text x="815" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b26a00" text-anchor="middle">dopisywane przy każdym naciśnięciu i POMINIĘTE</text>
  <text x="40" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="start">Dzisiejszy licznik nie jest zapisywany: to suma count_delta z dzisiaj, więc sam się zeruje o północy.</text>
  <text x="40" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="start">Wpisy historii to typ zdarzenia plus dane, nigdy gotowy tekst, więc karta pokazuje je w języku oglądającego.</text>
</svg>
