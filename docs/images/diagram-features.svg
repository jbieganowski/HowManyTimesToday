<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1efe9"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="588" rx="24" fill="url(#bg)" stroke="#ddd8cc" stroke-width="2"/>
