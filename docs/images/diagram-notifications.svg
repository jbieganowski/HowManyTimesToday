<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1efe9"/></linearGradient><marker id="m6b6859" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6859"/></marker></defs>
  <rect x="1" y="1" width="998" height="518" rx="24" fill="url(#bg)" stroke="#ddd8cc" stroke-width="2"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2b2b28" text-anchor="start">What happens when a term comes due</text>
  <text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6859" text-anchor="start">at T the sensor turns red, once, on the exact second</text>
  <rect x="40" y="190" width="190" height="90" rx="12" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="135.0" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">Timer</text>
  <text x="135.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">armed for the next</text>
  <text x="135.0" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">moment of change</text>
  <rect x="300" y="190" width="190" height="90" rx="12" fill="#fbe9e9" stroke="#c62828" stroke-width="1.8"/>
  <text x="395.0" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c62828" text-anchor="middle">Term opens</text>
  <text x="395.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="middle">sensor state: red</text>
  <line x1="230" y1="235" x2="300" y2="235" stroke="#6b6859" stroke-width="2" marker-end="url(#m6b6859)"/>
  <line x1="490" y1="235" x2="570" y2="146" stroke="#6b6859" stroke-width="2" marker-end="url(#m6b6859)"/>
  <rect x="570" y="110" width="390" height="74" rx="12" fill="#eee8f5" stroke="#5c3d82" stroke-width="1.8"/>
  <text x="765.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5c3d82" text-anchor="middle">In-app message</text>
  <text x="765.0" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="middle">card shows the description (panel open)</text>
  <line x1="490" y1="235" x2="570" y2="271" stroke="#6b6859" stroke-width="2" marker-end="url(#m6b6859)"/>
  <rect x="570" y="235" width="390" height="74" rx="12" fill="#e6f0f8" stroke="#4a90c4" stroke-width="1.8"/>
  <text x="765.0" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a90c4" text-anchor="middle">Event</text>
  <text x="765.0" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="middle">how_many_times_today_due</text>
  <line x1="490" y1="235" x2="570" y2="396" stroke="#6b6859" stroke-width="2" marker-end="url(#m6b6859)"/>
  <rect x="570" y="360" width="390" height="74" rx="12" fill="#fbf0dc" stroke="#b26a00" stroke-width="1.8"/>
  <text x="765.0" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b26a00" text-anchor="middle">Push (optional)</text>
  <text x="765.0" y="401" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="middle">notify.mobile_app_* with the description</text>
  <text x="40" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="start">The event payload: entity_id, name, description, scheduled_at. Nothing repeats at brown or when a term is missed.</text>
