<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1efe9"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="558" rx="24" fill="url(#bg)" stroke="#ddd8cc" stroke-width="2"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2b2b28" text-anchor="start">What the card shows, and where it comes from</text>
  <text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6859" text-anchor="start">everything comes from the attributes of the schedule's sensor</text>
  <rect x="40" y="110" width="330" height="400" rx="20" fill="#ffffff" stroke="#ddd8cc" stroke-width="2"/>
  <text x="205" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b2b28" text-anchor="middle">Heart medication</text>
  <circle cx="205" cy="232" r="62" fill="#c62828"/>
  <text x="205" y="255.56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="205" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b6859" text-anchor="middle">Take the pill with water</text>
  <text x="205" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2b2b28" text-anchor="middle">next at 16:00</text>
  <text x="205" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4a90c4" text-anchor="middle">▶ show history</text>
  <text x="205" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2b2b28" text-anchor="middle">OUTSIDE THE SCHEDULE - 12:00</text>
  <line x1="270" y1="232" x2="560" y2="214" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="214" r="5" fill="#c62828"/>
  <text x="574" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c62828" text-anchor="start">colour of the button</text>
  <text x="574" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">state, color_progress</text>
  <line x1="270" y1="232" x2="560" y2="280" stroke="#b26a00" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="280" r="5" fill="#b26a00"/>
  <text x="574" y="277" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b26a00" text-anchor="start">big number</text>
  <text x="574" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">count_today, planned_count, count_exceeded</text>
  <line x1="270" y1="232" x2="560" y2="340" stroke="#5c3d82" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="340" r="5" fill="#5c3d82"/>
  <text x="574" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c3d82" text-anchor="start">number blinks</text>
  <text x="574" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">number_blinking</text>
  <line x1="370" y1="336" x2="560" y2="400" stroke="#4a90c4" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="400" r="5" fill="#4a90c4"/>
  <text x="574" y="397" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a90c4" text-anchor="start">text under the button</text>
  <text x="574" y="415" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">description</text>
  <line x1="370" y1="372" x2="560" y2="450" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="450" r="5" fill="#2e7d32"/>
  <text x="574" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32" text-anchor="start">countdown</text>
  <text x="574" y="465" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">next_expected_at, seconds_to_next_expected</text>
  <line x1="370" y1="456" x2="560" y2="500" stroke="#6b6859" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="500" r="5" fill="#6b6859"/>
  <text x="574" y="497" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2b28" text-anchor="start">history (newest 50)</text>
  <text x="574" y="515" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">history: kind, outside_schedule</text>
  <text x="574" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">The A/B/C question appears when answer_required is true;</text>
  <text x="574" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">open_slots lists the unresolved terms.</text>
  <text x="574" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">The sound (attribute sound) plays on entering red and brown.</text>
</svg>
