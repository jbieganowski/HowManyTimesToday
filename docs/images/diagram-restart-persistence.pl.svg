<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1efe9"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="468" rx="24" fill="url(#bg)" stroke="#ddd8cc" stroke-width="2"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2b2b28" text-anchor="start">Stan po restarcie Home Assistanta</text>
  <text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6859" text-anchor="start">interwał 12 h, naciśnięcie 08:00, restart HA o 12:00, sprawdzenie o 20:30</text>
  <defs><linearGradient id="rppl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2e7d32"/><stop offset="1" stop-color="#c62828"/></linearGradient></defs>
  <line x1="110" y1="130" x2="110" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="110" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">08:00</text>
  <line x1="226" y1="130" x2="226" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="226" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">10:00</text>
  <line x1="342" y1="130" x2="342" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="342" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">12:00</text>
  <line x1="458" y1="130" x2="458" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="458" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">14:00</text>
  <line x1="574" y1="130" x2="574" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="574" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">16:00</text>
  <line x1="690" y1="130" x2="690" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="690" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">18:00</text>
  <line x1="806" y1="130" x2="806" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="806" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">20:00</text>
  <line x1="922" y1="130" x2="922" y2="392" stroke="#e4dfd2" stroke-width="1"/>
  <text x="922" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8777" text-anchor="middle">22:00</text>
  <text x="40" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c62828" text-anchor="start">Bez zapisanego stanu</text>
  <rect x="110" y="172" width="232" height="30" rx="4" fill="url(#rppl)"/>
  <rect x="342" y="172" width="580" height="30" rx="4" fill="#2e7d32"/>
  <text x="632" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">restart zerowałby cykl: zielony aż do kolejnego naciśnięcia</text>
  <text x="922" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828" text-anchor="end">o 20:30 byłoby 'green' —</text>
  <text x="922" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c62828" text-anchor="end">pominięta dawka wygląda na w terminie</text>
  <text x="40" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2e7d32" text-anchor="start">Z zapisanym stanem (jak działa)</text>
  <rect x="110" y="304" width="696" height="30" rx="4" fill="url(#rppl)"/>
  <rect x="806" y="304" width="116" height="30" rx="4" fill="#1f1f1f"/>
  <text x="458" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle">jeden ciągły cykl, restart niczego nie zmienia</text>
  <text x="922" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1f1f" text-anchor="end">o 20:30 'blinking_black'</text>
  <line x1="342" y1="165" x2="342" y2="210" stroke="#2b2b28" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="342" y1="297" x2="342" y2="342" stroke="#2b2b28" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="342" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2b2b28" text-anchor="middle">restart 12:00</text>
  <text x="110" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2b2b28" text-anchor="middle">naciśnięcie 08:00</text>
  <text x="806" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2b2b28" text-anchor="middle">termin 20:00</text>
  <text x="40" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2b2b28" text-anchor="start">Pominięta dawka nie może wyglądać na 'w terminie' tylko dlatego, że Home Assistant był restartowany.</text>
</svg>
