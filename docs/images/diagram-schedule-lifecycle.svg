<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1efe9"/></linearGradient><marker id="m6b6859" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6859"/></marker></defs>
  <rect x="1" y="1" width="998" height="428" rx="24" fill="url(#bg)" stroke="#ddd8cc" stroke-width="2"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2b2b28" text-anchor="start">A schedule's life</text>
  <text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6859" text-anchor="start">start and end bound it; it can also be switched off by hand</text>
  <rect x="60" y="150" width="160" height="40" rx="8" fill="#e4e1d8" stroke="#8a8777" stroke-width="1.5"/>
  <text x="140" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a8777" text-anchor="middle">pending</text>
  <rect x="220" y="150" width="560" height="40" rx="8" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="500" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32" text-anchor="middle">active — terms, presses, alerts</text>
  <rect x="780" y="150" width="160" height="40" rx="8" fill="#e4e1d8" stroke="#8a8777" stroke-width="1.5"/>
  <text x="860" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a8777" text-anchor="middle">inactive</text>
  <line x1="220" y1="130" x2="220" y2="210" stroke="#2b2b28" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="780" y1="130" x2="780" y2="210" stroke="#2b2b28" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="220" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2b28" text-anchor="middle">start (date + time)</text>
  <text x="780" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2b28" text-anchor="middle">end (optional)</text>
  <rect x="400" y="250" width="200" height="40" rx="8" fill="#e4e1d8" stroke="#8a8777" stroke-width="1.5"/>
  <text x="500" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a8777" text-anchor="middle">inactive</text>
  <line x1="500" y1="232" x2="500" y2="250" stroke="#6b6859" stroke-width="2" marker-end="url(#m6b6859)"/>
  <text x="510" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6859" text-anchor="start">switched off by hand</text>
  <text x="40" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2b28" text-anchor="start">pending / inactive: a grey button, no alerts, no MISSED entries, presses are refused (schedule_not_active).</text>
  <text x="40" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6859" text-anchor="start">Switching back on does not backfill the time spent off. The history stays available.</text>
</svg>
