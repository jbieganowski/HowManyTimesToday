press_schedule:
  name: Press schedule
  description: Confirm a schedule programmatically (the same as pressing its button on the card).
  target:
    entity:
      integration: how_many_times_today
      domain: sensor
  fields:
    answer:
      name: Answer
      description: >-
        Needed when pressing outside the tolerance window while a term is still open
        (the sensor attribute answer_required is true). It concerns the oldest open term.
      required: false
      selector:
        select:
          options:
            - already_done
            - do_now
            - extra
          translation_key: answer

clear_history:
  name: Clear history
  description: Clear a schedule's press history, entirely or for specific ISO weeks.
  target:
    entity:
      integration: how_many_times_today
      domain: sensor
  fields:
    weeks:
      name: Weeks
      description: "ISO week strings (e.g. 2026-W41). Omit to clear the whole history."
      required: false
      selector:
        object:

set_schedule_active:
  name: Switch schedule on or off
  description: >-
    Switch a schedule off by hand (grey button, no alerts, no missed entries) or back on.
  target:
    entity:
      integration: how_many_times_today
      domain: sensor
  fields:
    active:
      name: Active
      required: true
      selector:
        boolean:

reset_schedule:
  name: Reset to "all on time"
  description: >-
    Set a schedule to the state where everything due so far today was done on time: the
    counter matches the terms that have come due and today's history gets a normal entry
    for each of them (earlier days stay as they are).
  target:
    entity:
      integration: how_many_times_today
      domain: sensor

update_schedule:
  name: Change a schedule
  description: >-
    Change a schedule's name, description, times, interval, start, end or tolerance window.
    Switching its mode is done in the integration settings.
  target:
    entity:
      integration: how_many_times_today
      domain: sensor
  fields:
    name:
      name: Name
      required: false
      selector:
        text:
    description:
      name: Description
      required: false
      selector:
        text:
          multiline: true
    fixed_times:
      name: Times
      description: "Fixed-times schedules only: the times of the day as HH:MM (1-24 of them)."
      required: false
      selector:
        object:
    interval_hours:
      name: Interval (hours)
      description: "Every-X-hours schedules only (0.5 - 48)."
      required: false
      selector:
        number:
          min: 0.5
          max: 48
          step: 0.5
          mode: box
    start_at:
      name: Start
      required: false
      selector:
        datetime:
    end_at:
      name: End
      description: "Leave empty to remove the end."
      required: false
      selector:
        datetime:
    window_minutes:
      name: Tolerance window (minutes)
      required: false
      selector:
        number:
          min: 1
          max: 240
          step: 1
          mode: box
